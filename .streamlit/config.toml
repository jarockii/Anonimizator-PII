# Ustawienia bezpieczeństwa aplikacji. Streamlit czyta ten plik, gdy
# uruchamiasz `streamlit run app.py` z katalogu projektu.

[server]
# Domyślnie Streamlit słucha na wszystkich interfejsach (0.0.0.0), więc
# każdy w tej samej sieci (Wi-Fi w biurze, hotelu) mógłby otworzyć aplikację
# i zobaczyć sejf z danymi. Aplikacja nie ma logowania – tylko localhost.
address = "localhost"
headless = true
# Limit rozmiaru wgrywanego pliku (MB). Domyślne 200 MB pozwala zawiesić
# aplikację dużym PDF-em albo „bombą” .docx (spakowany XML).
maxUploadSize = 25
maxMessageSize = 50
enableXsrfProtection = true
enableCORS = true

[browser]
# Bez telemetrii Streamlita – aplikacja ma działać w pełni lokalnie.
gatherUsageStats = false
serverAddress = "localhost"

[client]
# Pełne ślady błędów mogą zawierać fragmenty przetwarzanego tekstu.
showErrorDetails = false
