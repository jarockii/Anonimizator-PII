# Ustawienia bezpieczeństwa aplikacji. Streamlit czyta ten plik, gdy
# uruchamiasz `streamlit run app.py` z katalogu projektu.

[server]
# Domyślnie Streamlit słucha na wszystkich interfejsach (0.0.0.0), więc
# każdy w tej samej sieci (Wi-Fi w biurze, hotelu) mógłby otworzyć aplikację
# i zobaczyć sejf z danymi. Aplikacja nie ma logowania – tylko localhost.
address = "localhost"
headless = true
# Limit rozmiaru wgrywanego pliku (MB). Domyślne 200 MB pozwala zawiesić
# aplikację dużym PDF-em albo „bombą” .docx (spakowany XML).
maxUploadSize = 25
maxMessageSize = 50
enableXsrfProtection = true
enableCORS = true

[browser]
# Bez telemetrii Streamlita – aplikacja ma działać w pełni lokalnie.
gatherUsageStats = false
serverAddress = "localhost"

[client]
# Pełne ślady błędów mogą zawierać fragmenty przetwarzanego tekstu.
showErrorDetails = false
# „viewer”: bez opcji dewelopera (rerun, deploy), ale z przełącznikiem motywu.
toolbarMode = "viewer"

# --- System projektowy -------------------------------------------------------
# Paleta (kontrast tekstu sprawdzony wg WCAG 2.1, w nawiasach: na tle Surface):
#   Primary    #1F2F4D  granat – znak marki, nagłówki sekcji
#   Secondary  #4B5D78  łupkowy – drugorzędne ikony i akcje
#   Accent     #2456D6  niebieski – główna akcja na ekranie (6.2:1, biały tekst na nim też 6.2:1)
#   Background #F5F6F8  tło aplikacji
#   Surface    #FFFFFF  karty, panele, pola
#   Text       #111827  tekst główny (17.7:1), Primary 13.4:1, Secondary 6.7:1
#   Text 2     #4B5563  tekst pomocniczy (7.6:1)
#   Border     #E2E5EA  subtelne obramowania
#   Success #15803D (5.0:1) · Warning #B45309 (5.0:1) · Error #B91C1C (6.5:1) · Info #1D4ED8 (6.7:1)
# Fonty: Inter, jeśli jest w systemie; inaczej Segoe UI Variable (Windows),
# SF (macOS), Roboto (Linux). Bez Google Fonts – przeglądarka nie łączy się
# z żadnym serwerem poza tym komputerem.
[theme]
# Wspólne dla obu motywów: kształt, fonty, rozmiary.
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
baseRadius = "8px"
buttonRadius = "8px"
baseFontSize = 15
baseFontWeight = 400
font = "Inter, Segoe UI Variable Text, Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif"
headingFont = "Inter, Segoe UI Variable Display, Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif"
codeFont = "Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace"
codeFontSize = "13px"
headingFontSizes = ["26px", "20px", "17px", "15px", "14px", "13px"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
metricValueFontSize = "24px"
metricValueFontWeight = 600

# Motyw jasny i ciemny: Streamlit domyślnie wybiera ten z ustawień systemu,
# a użytkownik może go zmienić w menu (⋮ -> Settings).
[theme.light]
primaryColor = "#2456D6"
backgroundColor = "#F5F6F8"
secondaryBackgroundColor = "#EEF1F5"
textColor = "#111827"
linkColor = "#2456D6"
borderColor = "#E2E5EA"
