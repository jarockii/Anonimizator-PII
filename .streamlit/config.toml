blueTextColor = "#1E40AF"
grayColor = "#4B5563"
grayBackgroundColor = "#F3F4F6"
grayTextColor = "#374151"
violetColor = "#4B5D78"
violetBackgroundColor = "#EEF1F6"
violetTextColor = "#1F2F4D"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F8"
borderColor = "#E2E5EA"

# Ciemny (kontrast na tle kart #161C25): tekst 14.2:1, pomocniczy 7.6:1,
# link 7.2:1, biały tekst na przycisku #3B6FE0 4.6:1, komunikaty na swoim tle 8.9–11.5:1.
