dataframeHeaderBackgroundColor = "#F3F5F8"
dataframeBorderColor = "#E2E5EA"
redColor = "#B91C1C"
redBackgroundColor = "#FDF2F2"
redTextColor = "#991B1B"
orangeColor = "#B45309"
orangeBackgroundColor = "#FFF7EB"
orangeTextColor = "#92400E"
yellowColor = "#B45309"
yellowBackgroundColor = "#FFF7EB"
yellowTextColor = "#92400E"
greenColor = "#15803D"
greenBackgroundColor = "#F0FAF3"
greenTextColor = "#166534"
blueColor = "#1D4ED8"
