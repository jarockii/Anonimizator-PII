[pytest]
testpaths = tests
markers =
    slow: wymaga prawdziwego modelu (GLiNER2) – pomiń: pytest -m "not slow"
# Ostrzeżenia z wnętrza PyMuPDF (generowany kod SWIG) – nie dotyczą naszego kodu.
filterwarnings =
    ignore:builtin type Swig:DeprecationWarning
    ignore:builtin type swigvarlink:DeprecationWarning
